# ─── Dashboard: commute card + "commute today" toggle ─────────────────────
# Add card → Manual. Options appear in your priority order; ★ = recommended.

type: vertical-stack
cards:
  - type: markdown
    content: >
      {% set s = 'sensor.commute_leave_in' %}
      {% set r = state_attr(s, 'recommended') %}
      {% set icons = {'ferry': '⛴️', 'bus': '🚌', 'bart': '🚇'} %}
      ## {{ '🏢 To office' if state_attr(s, 'direction') == 'to_office' else '🏠 To home' }}
      {%- if state_attr(s, 'stale') %} ⚠️ stale{% endif %}
      {%- if state_attr(s, 'polling_paused') %} ⏸️{% endif %}

      {% if r %}
      ### {{ icons.get(r.mode, '') }} {{ r.option }}: leave in **{{ r.leave_in }} min**
      Departs {{ r.depart[11:16] }} · arrive ~{{ r.eta[11:16] }}
      {%- if state_attr(s, 'arrive_by') %} · need by {{ state_attr(s, 'arrive_by')[11:16] }}{% endif %}
      {%- if r.reason != 'preferred' %}<br>_{{ r.reason }}_{% endif %}
      {% else %}
      _No catchable departures right now._
      {% endif %}

      | | Option | Leave in | Departs | Arrive | Then |
      |:-:|:--|--:|:-:|:-:|:--|
      {% for o in state_attr(s, 'options') or [] -%}
      {%- set n = o.next -%}
      | {{ '★' if r and o.option == r.option else '' }} | {{ icons.get(o.mode, '') }} {{ o.option }} | {{ (n.leave_in ~ ' min') if n else '—' }} | {{ n.depart[11:16] if n else '' }}{{ '' if not n or n.realtime else ' 🕒' }} | {{ n.eta[11:16] if n else '' }}{{ ' ⚠️' if n and n.on_time == false else '' }} | {{ o.later | join(', ') }} |
      {% endfor %}
  - type: tile
    entity: input_boolean.commute_today
    name: Commuting today
