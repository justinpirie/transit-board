# ─── transit-board HA package ─────────────────────────────────────────────
# These are YAML-only parts (the REST sensor and a trigger-based template sensor).
# Save as config/packages/transit_board.yaml. Requires this in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Then: Tools → YAML → Check configuration → restart (first time only; later
# edits reload with "REST entities" + "Template entities").
#
# Prereqs (UI, not YAML):
#   • Helper: Toggle "Commute today" → input_boolean.commute_today
#   • Integration: Holiday (Settings → Devices & services → Add → Holiday, US / CA)
#   • Integration: Google Calendar for your WORK calendar → calendar.work (rename to match)

# sensor.commute_leave_in is published by the Transit Board app itself
# (v0.5.0+), which also reads person / commute_today / arrive_by directly.
# Only the calendar-derived arrive-by sensor below still needs YAML.

template:
  # Trigger-based: needs calendar.get_events' response, which the Template
  # Helper UI can't do, so this one has to be YAML.
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    actions:
      - action: calendar.get_events
        target:
          entity_id: calendar.work                     # TODO: your work calendar entity
        data:
          start_date_time: "{{ now() }}"
          end_date_time: "{{ today_at('23:59') }}"
        response_variable: cal
    sensor:
      - name: Commute arrive by
        unique_id: transit_board_arrive_by
        device_class: timestamp
        # First timed event today that looks IN-PERSON: has a location that
        # isn't a video link. Target arriving 5 minutes before it.
        # Tweak the regex if your rooms are named differently.
        state: >
          {% set ns = namespace(t=none) %}
          {% for e in cal['calendar.work'].events | sort(attribute='start') %}
            {% set loc = e.location | default('', true) %}
            {% if ns.t is none and 'T' in e.start and loc
                  and not loc is search('https?://|zoom|meet\.google|teams', ignorecase=True) %}
              {% set ns.t = as_datetime(e.start) - timedelta(minutes=5) %}
            {% endif %}
          {% endfor %}
          {{ ns.t.isoformat() if ns.t else none }}
