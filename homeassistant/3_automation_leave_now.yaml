# ─── "Leave now" push ─────────────────────────────────────────────────────
# Fires when the RECOMMENDED option needs you out the door within 2 minutes.
# Buffers (3 min ferry/BART, 2 min bus) are already in that number, so
# "leave now" really means "now".
#
# Evening: once zone.office exists, duplicate this automation with
#   person state "Office" (the zone's name) and direction "to_home".

alias: Commute – leave now
description: Push the recommended departure + backup when it's time to leave (transit-board).
mode: single
triggers:
  - trigger: numeric_state
    entity_id: sensor.commute_leave_in
    below: 3
conditions:
  # numeric_state re-arms on restart / unavailable; require a real numeric drop
  - condition: template
    value_template: >
      {{ trigger.platform == 'numeric_state'
         and trigger.from_state is not none
         and is_number(trigger.from_state.state) }}
  - condition: state
    entity_id: input_boolean.commute_today
    state: "on"
  - condition: time
    after: "06:30:00"
    before: "11:00:00"
    weekday: [mon, tue, wed, thu, fri]
  - condition: state
    entity_id: person.you
    state: home
  - condition: state
    entity_id: sensor.commute_leave_in
    attribute: direction
    state: to_office
  - condition: state
    entity_id: sensor.commute_leave_in
    attribute: stale
    state: false
  # At most one push per 15 min (the next bus would otherwise re-trigger)
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 900 }}
actions:
  - variables:
      r: "{{ state_attr('sensor.commute_leave_in', 'recommended') }}"
      icon: "{{ {'ferry': '⛴️', 'bus': '🚌', 'bart': '🚇'}.get(r.mode, '🚶') }}"
      b: "{{ state_attr('sensor.commute_leave_in', 'backup') }}"
      backup: >
        {% if b %}Backup: {{ b.option }} {{ b.depart[11:16] }} (leave in {{ b.leave_in }}){% endif %}
  - action: notify.mobile_app_your_phone
    data:
      title: "{{ icon }} Leave now: {{ r.option }} {{ r.depart[11:16] }}"
      message: >
        {{ r.line }} → {{ r.dest }}{{ '' if r.realtime else ' (scheduled)' }}.
        Arrive ~{{ r.eta[11:16] }}{% if r.on_time == false %} ⚠️ late{% endif %}.
        {% if r.reason != 'preferred' %}({{ r.reason }}) {% endif %}{{ backup }}
      data:
        tag: commute
        push:
          interruption-level: time-sensitive
