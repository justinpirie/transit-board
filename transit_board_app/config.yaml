# Home Assistant app manifest (this is NOT the commute config; see default_config.yaml)
name: Transit Board
version: "0.7.2"
slug: transit_board
description: Real-time Bay Area commute planner (511.org) for Home Assistant
url: https://github.com/justinpirie/transit-board
arch:
  - aarch64     # Home Assistant Yellow / Raspberry Pi
  - amd64
init: false
startup: application
boot: auto
# Lets the app read your person/toggle/calendar entities and publish
# sensor.commute_leave_in via Core's REST API. No configuration.yaml needed.
homeassistant_api: true
# Host port 8099: open http://<HA IP>:8099/setup in a browser on your LAN.
# Ingress: HA proxies the app behind its own login, so it works remotely via
# Nabu Casa (sidebar panel) and lets tools call /setup without LAN access.
ingress: true
ingress_port: 8099
panel_icon: mdi:ferry
panel_title: Commute
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Transit Board API (/next, /setup, /health)
map:
  - homeassistant_config:rw   # commute config lives in /homeassistant/transit_board/
options:
  api_key: ""
  # Override any config value without editing files, one per line:
  #   to_office/Ferry.stop=12345
  #   to_office/Ferry.travel_minutes=10
  #   slack_minutes=10
  overrides: []
  # Entities the app reads (hints) and writes (the sensor). Leave
  # person_entity empty to skip GPS; missing commute/arrive_by entities are ignored.
  person_entity: ""
  commute_entity: input_boolean.commute_today
  arrive_by_entity: sensor.commute_arrive_by
  sensor_entity: sensor.commute_leave_in
  # Calendars (from HA's Google Calendar integration). Work calendars decide
  # in-person meetings and OOO days; the holiday calendar's public holidays
  # turn the commute off. Leave work_calendars empty to skip calendar logic.
  work_calendars: []
  holiday_calendar: ""
  # Empty = built-in defaults (SF rooms/addresses; OOO/PTO/vacation/sick/WFH)
  in_person_location_regex: ""
  off_day_title_regex: ""
schema:
  api_key: password
  overrides:
    - str
  person_entity: str?
  commute_entity: str?
  arrive_by_entity: str?
  sensor_entity: str?
  work_calendars:
    - str
  holiday_calendar: str?
  in_person_location_regex: str?
  off_day_title_regex: str?
